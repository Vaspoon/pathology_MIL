defaults:
  - _self_
  - model: abmil                # mil_max | mil_mean | attention_mil | abmil | transmil | clam_sb | clam_mb | multimodal_gated | multimodal_porpoise

experiment:
  name: ${model.name}_her2contest

data:
  train_csv:              data/splits_her2contest/train.csv
  val_csv:                data/splits_her2contest/val.csv
  embeddings_dir_train:   data/HER2CONTEST_224_embeddings/HE/train/
  embeddings_dir_val:     data/HER2CONTEST_224_embeddings/HE/val/
  # Used when model.name = multimodal_porpoise | multimodal_gated
  embeddings_dir_ihc_train: data/HER2CONTEST_224_embeddings/IHC/train/
  embeddings_dir_ihc_val:   data/HER2CONTEST_224_embeddings/IHC/val/
  dataset_key: embeddings
  # Optionnel — utilisé par train_cv.py comme jeu de test indépendant,
  # évalué pour chaque (seed, fold) en plus du fold de validation.
  test_csv:                 "data/splits_her2contest/test.csv"
  embeddings_dir_test:      "data/HER2CONTEST_224_embeddings/HE/test/"
  embeddings_dir_ihc_test:   "data/HER2CONTEST_224_embeddings/IHC/test/"

training:
  batch_size: 1
  lr: 1e-4
  epochs: 25
  device: cuda
  save_every: 5
  early_stopping: true               # active/désactive l'early stopping 
  early_stopping_patience: 7       
  monitor: val_loss                  # "val_loss" | "val_auc"
  bag_weight: 0.7                    # utilisé par TrainerCLAM (clam_sb / clam_mb) uniquement
  class_weights:  null # NormandIHC[2.367, 0.634]      # list[float] | null — poids par classe pour la cross-entropy
                                     # ex: [1.0, 3.0] pour repondérer, ou null pour une CE non pondérée
                                     # (nn.CrossEntropyLoss standard) — ignoré si loss: focal

  loss: cross_entropy                # "cross_entropy" | "focal"
                                     # focal = Focal Loss (Lin et al., ICCV 2017)
                                     # utilisé par Trainer, TrainerABMIL, TrainerCLAM (monomodal)
  focal_gamma: 2.0                   # paramètre gamma de la focal loss (ignoré si loss: cross_entropy)
  focal_alpha: [0.789, 0.211]                  # list[float] | null — alpha par classe (ignoré si loss: cross_entropy)
                                     # ex: [0.25, 0.75] comme dans le papier original

# Utilisé par train_cv.py (cross-validation multi-seeds)
cv:
  method: kfold        # "kfold" | "loo" (Leave-One-Out)
  k: 4                  # nombre de folds (ignoré si method == "loo")
  n_seeds: 10           # nombre de seeds testées
  seed_start: 0         # première seed (seeds = seed_start .. seed_start + n_seeds - 1)
  # seeds: [42]  # si fourni, remplace n_seeds/seed_start
  save_checkpoints: false   # sauvegarder les .pt de chaque fold (volumineux pour LOO)
  save_best_per_seed: true  # sauvegarder un seul modèle (le meilleur, toutes folds confondues) par seed
  results_dir: outputs/cv_results_her2contest_teachers # chemin stable lu par les notebooks d'évaluation

# Utilisé par train_distillation.py (KD depuis un teacher multimodal PORPOISE
# vers le student unimodal HE défini par le groupe `model` ci-dessus).
# Réutilise cv.{seeds,seed_start,n_seeds,k} et training.{lr,epochs,early_stopping_patience,
# loss,class_weights,focal_gamma,focal_alpha,device} — pas dupliqués ici.
distillation:
  teacher_path: outputs/cv_results_her2contest_teachers/multimodal_porpoise/seed42_best.pt
  teacher_hidden_dim: 256  # hidden_dim du teacher au moment de son entraînement (indépendant
                           # du hidden_dim du student défini par le groupe `model` — ex. TransMIL=512)
  alpha: 0.5            # poids de la distill loss vs hard label loss
  temperature: 4.0       # température des soft logits (mode logits/both)
  feature_weight: 1.0    # poids de la feature loss relative à la logit loss (mode both)
  mode: [logits, features, both]   # mode(s) de distillation à exécuter
  output_dir: outputs/distillation_her2contest_porpoise

heatmap:
  patch_size: 256
  downsample: 4
  colormap: jet
  alpha: 0.5
  top_k: 10

hydra:
  run:
    dir: outputs/${experiment.name}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${experiment.name}_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
